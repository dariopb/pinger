<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xterm Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@200&family=Ubuntu+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.14.5/xterm.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #app-container {
            display: flex;
            height: calc(var(--vh, 1vh) * 100);
            width: calc(var(--vw, 1vw) * 100);
            position: relative;
        }
        
        #terminal-container {
            flex-grow: 1;
            height: 100%;
            background-color: #000;
        }
        
        #config-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background-color: #ffd900a0; /* Yellow */
            color: black;
            border: none;
            border-radius: 50%; /* Round */
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: move; /* Indicates draggable */
            transition: background-color 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            user-select: none; /* Prevents text selection during drag */
        }
        
        #config-button:hover {
            background-color: #FFEB3B;
        }
        
        #config-panel {
            width: 250px;
            height: 100%;
            background-color: #f5f5f5;
            border-right: 1px solid #ddd;
            position: absolute;
            left: -250px;
            top: 0;
            transition: transform 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 50;
        }
        
        #config-panel.open {
            transform: translateX(250px);
        }
        
        .config-section {
            margin-bottom: 20px;
        }
        
        .config-section h3 {
            margin-top: 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        
        .form-group {
            margin-bottom: 10px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        
        .color-option {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .color-option label {
            flex-grow: 1;
            margin-right: 10px;
        }
        
        .color-option input[type="color"] {
            width: 40px;
            height: 25px;
            padding: 0;
            border: none;
        }
        
        .apply-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        .apply-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="terminal-container"></div>
        <button id="config-button">☰</button>
        <div id="config-panel">
            <div class="config-section">
                <h3>Terminal Settings</h3>
                <div class="form-group">
                    <label for="font-size">Font Size (px)</label>
                    <input type="number" id="font-size" value="14" min="8" max="32">
                </div>
                <div class="form-group">
                    <label for="font-family">Font Family</label>
                    <select id="font-family">
                        <option value="'Courier New', monospace">Courier New</option>
                        <option value="'Cascadia Code', monospace">Cascadia Code</option>
                        <option value="monospace">Monospace</option>
                        <option value="'Roboto Mono', monospace">Roboto Mono</option>
                        <option value="'Ubuntu Mono', monospace">Ubuntu Mono</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cursor-style">Cursor Style</label>
                    <select id="cursor-style">
                        <option value="block">Block</option>
                        <option value="underline">Underline</option>
                        <option value="bar">Bar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cursor-blink">Cursor Blink</label>
                    <select id="cursor-blink">
                        <option value="true">On</option>
                        <option value="false">Off</option>
                    </select>
                </div>
            </div>
            
            <div class="config-section">
                <h3>Colors</h3>
                <div class="color-option">
                    <label for="background-color">Background</label>
                    <input type="color" id="background-color" value="#000000">
                </div>
                <div class="color-option">
                    <label for="foreground-color">Foreground</label>
                    <input type="color" id="foreground-color" value="#ffffff">
                </div>
                <div class="color-option">
                    <label for="cursor-color">Cursor</label>
                    <input type="color" id="cursor-color" value="#ffffff">
                </div>
                <div class="color-option">
                    <label for="selection-color">Selection</label>
                    <input type="color" id="selection-color" value="#4d4d4d">
                </div>
            </div>
            
            <button class="apply-button" id="apply-settings">Apply Settings</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.14.5/xterm.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.14.5/addons/fit/fit.min.js"></script>
    <script src="/web/xterm-webfont.js" ></script>

    <script>
        // Initialize Variables
        let term;
        let configOpen = false;
        let isDragging = false;
        let offsetX, offsetY;
        
        // DOM Elements
        const configButton = document.getElementById('config-button');
        const configPanel = document.getElementById('config-panel');
        const applyButton = document.getElementById('apply-settings');
        const terminalContainer = document.getElementById('terminal-container');
        
        var loc = window.location;
        var wsProtocol = loc.protocol === "https:" ? "wss://" : "ws://";
        var wsuri = wsProtocol + loc.hostname + ":" + loc.port + "/xterm/ws" + loc.search;
        var websocket = new WebSocket(wsuri);
        websocket.binaryType = "arraybuffer";

        function ab2str(buf) {
            return String.fromCharCode.apply(null, new Uint8Array(buf));
        }

        function Decodeuint8arr(buf){
            var text = new TextDecoder("utf-8").decode(buf);
            return text;
        }

        function setViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        function setViewportWidth() {
            const vw = window.innerWidth * 0.01;
            document.documentElement.style.setProperty('--vw', `${vw}px`);
        }

        // Set the initial viewport width
        setViewportWidth();

        // Initialize terminal
        function initTerminal() {
            // Load the FitAddon
            Terminal.applyAddon(fit);
            //Terminal.applyAddon(XtermWebfont);
            
            // Create terminal with default options
            term = new Terminal({
                fontSize: 14,
                fontFamily: "'Cascadia Code', monospace",
                cursorStyle: 'block',
                cursorBlink: true,
                theme: {
                    background: '#000000',
                    foreground: '#ffffff',
                    cursor: '#ffffff',
                    selection: '#4d4d4d88'
                },
                rendererType: 'canvas',
                allowTransparency: true
            });

            term.loadAddon(new XtermWebfont());

            // Enable Ctrl+C and Ctrl+V for cut and paste
/*            term.attachCustomKeyEventHandler((e) => {
                if (e.ctrlKey && e.shiftKey && (e.key.toLowerCase() === 'c' || e.key.toLowerCase() === 'v')) {
                    e.stopPropagation();
                    e.preventDefault();
                    return false; // Allow browser's default behavior
                }
                return true; // Allow other key events
            });
            */
            term.attachCustomKeyEventHandler((e) => {
                if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
                    e.preventDefault();
                    e.stopPropagation();

                    // Copy selected text to clipboard
                    const selectedText = term.getSelection();
                    if (selectedText) {
                        navigator.clipboard.writeText(selectedText).then(() => {
                            console.log('Copied to clipboard:', selectedText);
                        }).catch(err => {
                            console.error('Failed to copy text:', err);
                        });
                    }

                    return true; // Prevent browser's default behavior
                }

                if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'v') {
            
                    // Paste clipboard content into the terminal
                    navigator.clipboard.readText().then((clipboardText) => {
                        term.write(clipboardText);
                    }).catch(err => {
                        console.error('Failed to read clipboard:', err);
                    });

                    e.preventDefault();
                    e.stopPropagation();
        
                    return true; // Prevent browser's default behavior
                }

                if (e.type === 'keydown' && e.altKey && !e.ctrlKey) {
                    const key = e.key;
                    //alert("Key pressed: " + key);
                    
                    // Handle printable characters
                    if (key && key.length === 1) {
                        term.write(`\x1b${key}`);
                        return false;
                    }
                    
                    // Handle special keys with Alt
                    if (key === 'ArrowUp') {
                        term.write('\x1b[1;3A'); // Alt+Up arrow
                        return false;
                    } else if (key === 'ArrowDown') {
                        term.write('\x1b[1;3B'); // Alt+Down arrow
                        return false;
                    } else if (key === 'ArrowRight') {
                        //alert('Right');
                        term.write('\x1b[1;3C'); // Alt+Right arrow
                        return false;
                    } else if (key === 'ArrowLeft') {
                        term.write('\x1b[1;3D'); // Alt+Left arrow
                        return false;
                    }

                    e.preventDefault();
                    e.stopPropagation();
                }

                return true; // Allow other key events
            });
            
            // Open terminal in the container
            term.open(terminalContainer);
            
            // Make terminal fit the container
            term.fit();
            
            term.write('Initializing remote \x1B[33;1munrestricted\x1B[0m console...\n\x1B[1E')
            term.writeln('');
            
            term.onData(data => {
                term.fit();
                websocket.send(new TextEncoder().encode("\x00" + data));
            });

            term.onTitleChange(title => {
                document.title = title;
            });

            term.onResize(evt => {
                websocket.send(new TextEncoder().encode("\x01" + JSON.stringify({cols: evt.cols, rows: evt.rows})))
            });

            websocket.send(new TextEncoder().encode("\x01" + JSON.stringify({cols: term.cols, rows: term.rows})))
            
            // Handle terminal resizing
            window.addEventListener('resize', () => {
                term.fit();
                setViewportHeight();
                setViewportWidth();
            });

            websocket.onmessage = function(evt) {
                if (evt.data instanceof ArrayBuffer) {
                    //term.writeUtf8(Decodeuint8arr(evt.data));
                    term.write(Decodeuint8arr(evt.data));
                } else {
                    //alert(evt.data)
                    term.write('\x1B[31;1m' + evt.data +'\x1B[0m\n\x1B[1E')
                }
            }

            websocket.onclose = function(evt) {
                term.write("Session terminated");
                //term.destroy();
            }

            websocket.onerror = function(evt) {
                if (typeof console.log == "function") {
                    console.log(evt)
                }
            }
        }
        
        // Toggle config panel
        function toggleConfigPanel(e) {
            // Prevent this from triggering when dragging
            if (isDragging) {
                return;
            }
            configOpen = !configOpen;
            if (configOpen) {
                configPanel.classList.add('open');
            } else {
                configPanel.classList.remove('open');
            }
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
        }
        
        // Apply settings from config panel
        function applySettings() {
            const fontSize = document.getElementById('font-size').value;
            const fontFamily = document.getElementById('font-family').value;
            const cursorStyle = document.getElementById('cursor-style').value;
            const cursorBlink = document.getElementById('cursor-blink').value === 'true';
            const backgroundColor = document.getElementById('background-color').value;
            const foregroundColor = document.getElementById('foreground-color').value;
            const cursorColor = document.getElementById('cursor-color').value;
            const selectionColor = document.getElementById('selection-color').value;
            
            // Apply settings to terminal
            term.setOption('fontSize', parseInt(fontSize));
            term.setOption('fontFamily', fontFamily);
            term.setOption('cursorStyle', cursorStyle);
            term.setOption('cursorBlink', cursorBlink);
            
            // Apply theme
            term.setOption('theme', {
                background: backgroundColor,
                foreground: foregroundColor,
                cursor: cursorColor,
                selection: selectionColor
            });

            // Fit terminal after changes
            term.fit();

            configOpen = false;
            configPanel.classList.remove('open');
        }
        
        // Variables to track dragging state
        let lastButtonTouched = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragThreshold = 5; // Pixels of movement needed to consider it a drag
        let mouseDownTime = 0;
        
        // Drag functionality for the config button
        function dragStart(e) {
            // Only process if the target is the config button
            if (e.target !== configButton) return;
            
            // Record that the button was the last element touched
            lastButtonTouched = true;
            
            // Record starting position and time for click vs drag detection
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            mouseDownTime = Date.now();
            
            // Store offset for drag positioning
            offsetX = e.clientX - configButton.getBoundingClientRect().left;
            offsetY = e.clientY - configButton.getBoundingClientRect().top;
            
            // Not dragging yet - we'll determine this in the mousemove handler
            isDragging = false;
        }
        
        function drag(e) {
            // Calculate movement distance
            const moveX = Math.abs(e.clientX - dragStartX);
            const moveY = Math.abs(e.clientY - dragStartY);
            
            // If moved more than threshold, consider it a drag
            if (lastButtonTouched && !isDragging && (moveX > dragThreshold || moveY > dragThreshold)) {
                isDragging = true;
            }
            
            // Only move the button if we're in drag mode
            if (isDragging) {
                // Calculate new position
                const x = e.clientX - offsetX;
                const y = e.clientY - offsetY;
                
                // Set boundaries to keep button within viewport
                const maxX = window.innerWidth - configButton.offsetWidth;
                const maxY = window.innerHeight - configButton.offsetHeight;
                
                // Apply new position with boundaries
                configButton.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
                configButton.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
                
                e.preventDefault();
            }
        }
        
        function dragEnd(e) {
            // Only process as a click if:
            // 1. It wasn't a drag (minimal movement)
            // 2. The mouse up is quick (less than 200ms)
            // 3. The button was the element that initiated the mouse down
            if (!isDragging && 
                (Date.now() - mouseDownTime < 200) && 
                lastButtonTouched) {
                toggleConfigPanel(e);
            }
            
            // Reset states
            isDragging = false;
            lastButtonTouched = false;
        }
        
        // Touch events for mobile
        function touchDragStart(e) {
            if (e.touches.length === 1) {
                // Only process if the target is the config button
                if (e.target !== configButton) return;
                
                // Record that the button was the last element touched
                lastButtonTouched = true;
                
                const touch = e.touches[0];
                
                // Record starting position and time for tap vs drag detection
                dragStartX = touch.clientX;
                dragStartY = touch.clientY;
                mouseDownTime = Date.now();
                
                // Store offset for positioning
                offsetX = touch.clientX - configButton.getBoundingClientRect().left;
                offsetY = touch.clientY - configButton.getBoundingClientRect().top;
                
                // Not dragging yet
                isDragging = false;
                
                // Prevent default to avoid text selection
                e.preventDefault();
            }
        }
        
        function touchDrag(e) {
            if (e.touches.length !== 1) return;
            
            const touch = e.touches[0];
            
            // Calculate movement distance
            const moveX = Math.abs(touch.clientX - dragStartX);
            const moveY = Math.abs(touch.clientY - dragStartY);
            
            // If moved more than threshold, consider it a drag
            if (!isDragging && (moveX > dragThreshold || moveY > dragThreshold)) {
                isDragging = true;
            }
            
            // Only move if dragging
            if (isDragging) {
                // Calculate new position
                const x = touch.clientX - offsetX;
                const y = touch.clientY - offsetY;
                
                // Set boundaries
                const maxX = window.innerWidth - configButton.offsetWidth;
                const maxY = window.innerHeight - configButton.offsetHeight;
                
                // Apply new position with boundaries
                configButton.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
                configButton.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
                
                e.preventDefault();
            }
        }

        // Set the initial viewport height
        setViewportHeight();

        // Initialize everything when page loads
        window.addEventListener('load', () => {
            websocket.onopen = function(evt) {
                // Initialize terminal
                initTerminal();
                
                // Set up event listeners
                // Note: We're removing the click handler and handling clicks in dragEnd
                //configButton.addEventListener('click', toggleConfigPanel);
                applyButton.addEventListener('click', applySettings);
                
                // Set up event listeners for draggable button
                // We're adding these listeners to document to capture all events
                // but we filter based on target in the handlers
                document.addEventListener('mousedown', dragStart);
                document.addEventListener('mousemove', drag);
                document.addEventListener('mouseup', dragEnd);
                            
                // Touch support for mobile devices
                document.addEventListener('touchstart', touchDragStart);
                document.addEventListener('touchmove', touchDrag);
                document.addEventListener('touchend', dragEnd);
            }
        });
    </script>
</body>
</html>
